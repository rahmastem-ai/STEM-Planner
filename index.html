<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEM Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #172033;

        header {

            max-width: 1100px;
            margin: auto;

        header h1 {
            font-size: 38px;

            font-size: 17px;

        .stat strong {

        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5dce7;
            border-radius: 9px;
            font-size: 15px;

        button {
            border: none;
            padding: 13px 18px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .add-btn {
            background: #1769aa;
            color: white;
            margin-top: 12px;
        }

        .add-btn:hover {
            background: #12558b;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #eef3f8;

        }

            background: #1769aa;

                flex-direction: column;

                width: 100%;
            }

</head>

<body>

<header>
    <div class="container">
        <h1>STEM Planner 📚</h1>
        <p>A simple planner that helps STEM students organize tasks, deadlines, and priorities.</p>
    </div>
</header>

<div class="container">

    <div class="stats">

        <div class="stat">
            <h3>Total Tasks</h3>
            <strong id="totalTasks">0</strong>
        </div>

        <div class="stat">
            <h3>Completed</h3>
            <strong id="completedTasks">0</strong>
        </div>

        <div class="stat">
            <h3>Progress</h3>
            <strong id="progressPercent">0%</strong>
        </div>

    </div>

    <div class="card">

        <h2>Add a New Task</h2>

        <div class="form-grid">

            <input
                type="text"
                id="taskInput"
                placeholder="Example: Chemistry Midterm"
            >

            <input
                type="date"
                id="dateInput"
            >

            <select id="priorityInput">
                <option value="High">High Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="Low">Low Priority</option>
            </select>

        </div>

        <button class="add-btn" onclick="addTask()">
            + Add Task
        </button>

    </div>

    <div class="card">

        <h2>My Tasks</h2>

        <div class="filters">

            <button
                class="filter-btn active"
                onclick="setFilter('all', this)">
                All
            </button>

            <button
                class="filter-btn"
                onclick="setFilter('active', this)">
                Active
            </button>

            <button
                class="filter-btn"
                onclick="setFilter('completed', this)">
                Completed
            </button>

        </div>

        <div id="taskList"></div>

    </div>

    <div class="card">

        <h2>My Progress</h2>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p class="progress-text" id="progressMessage">
            Start adding tasks to track your progress.
        </p>

    </div>

</div>

<footer>
    STEM Planner — Built for students 🚀
</footer>


<script>

    let tasks = JSON.parse(localStorage.getItem("stemTasks")) || [];

    let currentFilter = "all";


    function saveTasks() {
        localStorage.setItem("stemTasks", JSON.stringify(tasks));
    }


    function addTask() {

        const taskInput = document.getElementById("taskInput");
        const dateInput = document.getElementById("dateInput");
        const priorityInput = document.getElementById("priorityInput");

        const title = taskInput.value.trim();
        const date = dateInput.value;
        const priority = priorityInput.value;

        if (title === "") {
            alert("Please enter a task.");
            return;
        }

        const task = {
            id: Date.now(),
            title: title,
            date: date,
            priority: priority,
            completed: false
        };

        tasks.push(task);

        saveTasks();

        taskInput.value = "";
        dateInput.value = "";

        renderTasks();
    }


    function toggleTask(id) {

        tasks = tasks.map(task => {

            if (task.id === id) {
                return {
                    ...task,
                    completed: !task.completed
                };
            }

            return task;

        });

        saveTasks();

        renderTasks();
    }


    function deleteTask(id) {

        tasks = tasks.filter(task => task.id !== id);

        saveTasks();

        renderTasks();
    }


    function setFilter(filter, button) {

        currentFilter = filter;

        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        renderTasks();
    }


    function renderTasks() {

        const taskList = document.getElementById("taskList");

        let filteredTasks = tasks;

        if (currentFilter === "active") {
            filteredTasks = tasks.filter(task => !task.completed);
        }

        if (currentFilter === "completed") {
            filteredTasks = tasks.filter(task => task.completed);
        }

        if (filteredTasks.length === 0) {

            taskList.innerHTML = `
                <div class="empty">
                    No tasks here yet. Add your first task!
                </div>
            `;

        } else {

            taskList.innerHTML = filteredTasks.map(task => {

                const priorityClass = task.priority.toLowerCase();

                return `
                    <div class="task ${task.completed ? "completed" : ""}">

                        <div class="task-info">

                            <div class="task-title">
                                ${escapeHTML(task.title)}
                            </div>

                            <div class="task-meta">
                                ${task.date ? "Deadline: " + task.date : "No deadline"}
                            </div>

                            <span class="priority ${priorityClass}">
                                ${task.priority}
                            </span>

                        </div>

                        <div class="actions">

                            <button
                                class="complete-btn"
                                onclick="toggleTask(${task.id})">
                                ${task.completed ? "Undo" : "Done"}
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteTask(${task.id})">
                                Delete
                            </button>

                        </div>

                    </div>
                `;

            }).join("");
        }

        updateStats();
    }


    function updateStats() {

        const total = tasks.length;

        const completed = tasks.filter(
            task => task.completed
        ).length;

        const progress = total === 0
            ? 0
            : Math.round((completed / total) * 100);

        document.getElementById("totalTasks").textContent = total;

        document.getElementById("completedTasks").textContent = completed;

        document.getElementById("progressPercent").textContent =
            progress + "%";

        document.getElementById("progressBar").style.width =
            progress + "%";

        const message = document.getElementById("progressMessage");

        if (total === 0) {
            message.textContent =
                "Start adding tasks to track your progress.";
        } else if (progress === 100) {
            message.textContent =
                "Amazing! You completed everything! 🎉";
        } else if (progress >= 50) {
            message.textContent =
                "Great progress! Keep going! 💪";
        } else {
            message.textContent =
                "Keep working. Every completed task counts!";
        }
    }


    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    renderTasks();

</script>

</body>
</html>
